services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fuel_route}
      POSTGRES_USER: ${POSTGRES_USER:-fuel_route}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fuel_route}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-fuel_route} -d ${POSTGRES_DB:-fuel_route}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    ports:
      - "5432:5432"

  web:
    build: .
    env_file:
      - .env
    environment:
      DEBUG: ${DEBUG:-true}
      SECRET_KEY: ${SECRET_KEY:-django-insecure-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-fuel_route}
      POSTGRES_USER: ${POSTGRES_USER:-fuel_route}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fuel_route}
      POSTGRES_HOST: db
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      ORS_API_KEY: ${ORS_API_KEY:-}
      ORS_BASE_URL: ${ORS_BASE_URL:-https://api.heigit.org}
      ROUTE_CACHE_TIMEOUT_SECONDS: ${ROUTE_CACHE_TIMEOUT_SECONDS:-86400}
      ROUTE_STATION_CORRIDOR_MILES: ${ROUTE_STATION_CORRIDOR_MILES:-5}
      VEHICLE_MAX_RANGE_MILES: ${VEHICLE_MAX_RANGE_MILES:-500}
      VEHICLE_MPG: ${VEHICLE_MPG:-10}
      # Bind mounts on Docker Desktop often miss inotify events; poll for reload.
      WATCHFILES_FORCE_POLLING: "true"
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
